name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: study-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: bash native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTogether-ipa
          path: study-ios/StudyTogether.ipa
